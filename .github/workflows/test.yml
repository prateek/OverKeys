name: Tests

on:
  push:
    branches: [main, develop, refactor/**]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.2"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.2"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS debug app
        run: flutter build macos --debug

      - name: Build macOS release app
        run: flutter build macos --release

      - name: Verify release entitlements
        run: |
          codesign -d --entitlements :- build/macos/Build/Products/Release/OverKeys.app > release-entitlements.plist 2>/dev/null
          if grep -q "com.apple.security.get-task-allow" release-entitlements.plist; then
            echo "Release app must not include get-task-allow"
            exit 1
          fi
          if grep -q "com.apple.security.app-sandbox" release-entitlements.plist; then
            echo "Release app must not include App Sandbox"
            exit 1
          fi
